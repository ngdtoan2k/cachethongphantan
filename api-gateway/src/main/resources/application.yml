server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/users/**
        
        - id: product-service
          uri: http://product-service:8082
          predicates:
            - Path=/api/products/**
            
        - id: cart-service
          uri: http://cart-service:8083
          predicates:
            - Path=/api/cart/**
            
        - id: order-service
          uri: http://order-service:8084
          predicates:
            - Path=/api/orders/**

# Cấu hình logging cơ bản
logging:
  level:
    root: INFO
    com.ecommerce.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
  pattern:
    console: "%d{HH:mm:ss} [%thread] [TraceId: %X{traceId:-}, SpanId: %X{spanId:-}] %-5level %logger{36} - %msg%n"
