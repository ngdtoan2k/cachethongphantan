<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard — MicroShop</title>
    <meta name="description" content="Admin panel for managing products on MicroShop.">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-layout {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 2rem;
            margin-top: 2rem;
        }
        .admin-form-card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: 2rem;
            height: fit-content;
            position: sticky;
            top: 100px;
        }
        .admin-form-card h3 {
            margin-bottom: 1.5rem;
            font-size: 1.2rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .products-table-wrap {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: 2rem;
        }
        .products-table-wrap h3 {
            margin-bottom: 1.5rem;
            font-size: 1.2rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        .admin-table th {
            text-align: left;
            padding: 0.75rem 1rem;
            color: var(--text-muted);
            font-weight: 500;
            border-bottom: 1px solid var(--glass-border);
            white-space: nowrap;
        }
        .admin-table td {
            padding: 0.9rem 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            vertical-align: middle;
        }
        .admin-table tr:last-child td {
            border-bottom: none;
        }
        .admin-table tr:hover td {
            background: rgba(34, 197, 94, 0.05);
        }
        .badge-stock {
            padding: 0.2rem 0.6rem;
            border-radius: 99px;
            font-size: 0.78rem;
            font-weight: 600;
        }
        .modal-content {
            max-width: 560px;
        }
        .modal-form {
            display: grid;
            gap: 1rem;
        }
        .modal-form label {
            font-size: 0.95rem;
            color: var(--text-muted);
        }
        .modal-form input {
            width: 100%;
            padding: 0.85rem 1rem;
            border-radius: var(--radius);
            background: var(--surface);
            border: 1px solid var(--glass-border);
            color: var(--text);
            font-size: 0.95rem;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            margin-top: 1rem;
        }
        .modal-actions .btn {
            min-width: 110px;
        }
        .btn-secondary {
            background: rgba(255,255,255,0.08);
            color: var(--text);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.12);
        }
        .badge-stock.ok { background: rgba(16,185,129,0.15); color: #10b981; }
        .badge-stock.low { background: rgba(239,68,68,0.15); color: #ef4444; }
        .btn-delete {
            background: rgba(239,68,68,0.1);
            color: #ef4444;
            border: 1px solid rgba(239,68,68,0.2);
            padding: 0.35rem 0.8rem;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 0.82rem;
            transition: all 0.2s;
        }
        .btn-delete:hover {
            background: rgba(239,68,68,0.2);
        }
        .admin-back {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .admin-back:hover { color: var(--primary); }
        @media (max-width: 900px) {
            .admin-layout { grid-template-columns: 1fr; }
            .admin-form-card { position: static; }
        }
    </style>
</head>
<body>
    <div id="toast-container"></div>

    <!-- Navbar -->
    <nav class="navbar glass">
        <div class="nav-content">
            <h1 class="logo"><i class="fa-solid fa-screwdriver-wrench"></i> Admin Dashboard</h1>
            <div class="nav-links">
                <span id="admin-name" style="color: var(--primary); font-weight: 600;"></span>
                <button class="btn btn-ghost" onclick="window.location.href='index.html'">
                    <i class="fa-solid fa-store"></i> Back to Shop
                </button>
                <button class="btn btn-danger" onclick="logoutAdmin()">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </button>
            </div>
        </div>
    </nav>

    <main class="container">
        <div style="margin: 1.5rem 0; display: flex; justify-content: space-between; align-items: center;">
            <span class="admin-back" onclick="window.location.href='index.html'">
                <i class="fa-solid fa-arrow-left"></i> Back to Store
            </span>
        </div>

        <!-- Stats Panel -->
        <div class="admin-stats-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.5rem; margin-bottom: 2rem;">
            <div class="glass-panel" style="padding: 1.5rem; display: flex; align-items: center; gap: 1rem;">
                <div style="font-size: 2rem; color: var(--primary); background: rgba(34, 197, 94, 0.1); width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center;">
                    <i class="fa-solid fa-boxes-stacked"></i>
                </div>
                <div>
                    <span style="font-size: 0.85rem; color: var(--text-muted); display: block;">Total Products</span>
                    <h2 id="stat-products" style="font-size: 1.6rem; font-weight: 700;">0</h2>
                </div>
            </div>
            <div class="glass-panel" style="padding: 1.5rem; display: flex; align-items: center; gap: 1rem;">
                <div style="font-size: 2rem; color: #6366f1; background: rgba(99, 102, 241, 0.1); width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center;">
                    <i class="fa-solid fa-users"></i>
                </div>
                <div>
                    <span style="font-size: 0.85rem; color: var(--text-muted); display: block;">Total Users</span>
                    <h2 id="stat-users" style="font-size: 1.6rem; font-weight: 700;">0</h2>
                </div>
            </div>
            <div class="glass-panel" style="padding: 1.5rem; display: flex; align-items: center; gap: 1rem;">
                <div style="font-size: 2rem; color: #eab308; background: rgba(234, 179, 8, 0.1); width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center;">
                    <i class="fa-solid fa-receipt"></i>
                </div>
                <div>
                    <span style="font-size: 0.85rem; color: var(--text-muted); display: block;">Total Orders</span>
                    <h2 id="stat-orders" style="font-size: 1.6rem; font-weight: 700;">0</h2>
                </div>
            </div>
        </div>

        <!-- Admin Navigation Tabs -->
        <div class="auth-tabs" style="margin-bottom: 2rem;">
            <button id="tab-products" class="auth-tab active" onclick="switchAdminTab('products')">
                <i class="fa-solid fa-boxes-stacked"></i> Manage Products
            </button>
            <button id="tab-users" class="auth-tab" onclick="switchAdminTab('users')">
                <i class="fa-solid fa-users"></i> Manage Users
            </button>
            <button id="tab-orders" class="auth-tab" onclick="switchAdminTab('orders')">
                <i class="fa-solid fa-receipt"></i> Manage Orders
            </button>
        </div>

        <!-- Products Tab Content -->
        <div id="tab-content-products" class="admin-layout">
            <!-- Add Product Form -->
            <div class="admin-form-card">
                <h3><i class="fa-solid fa-plus-circle"></i> Add New Product</h3>
                <form id="add-product-form" onsubmit="addProduct(event)">
                    <div class="form-group">
                        <label for="prod-name">Product Name</label>
                        <input type="text" id="prod-name" required placeholder="e.g. MacBook Pro M3">
                    </div>
                    <div class="form-group">
                        <label for="prod-desc">Description</label>
                        <textarea id="prod-desc" rows="3" placeholder="Short product description..." style="width:100%; background:var(--surface); border:1px solid var(--glass-border); color:var(--text); border-radius:var(--radius); padding:0.75rem; font-family:inherit; font-size:0.9rem; resize:vertical;"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="prod-price">Price (USD)</label>
                        <input type="number" id="prod-price" required min="0" step="0.01" placeholder="e.g. 999.99">
                    </div>
                    <div class="form-group">
                        <label for="prod-stock">Stock Quantity</label>
                        <input type="number" id="prod-stock" required min="0" placeholder="e.g. 50">
                    </div>
                    <button type="submit" id="btn-add-product" class="btn btn-primary btn-block">
                        <i class="fa-solid fa-plus"></i> Add Product
                    </button>
                </form>
            </div>

            <!-- Product List Table -->
            <div class="products-table-wrap">
                <h3>
                    <i class="fa-solid fa-boxes-stacked"></i> All Products
                    <button class="btn btn-icon" onclick="loadAdminProducts()" title="Refresh" style="margin-left:auto;">
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>
                </h3>
                <div id="admin-products-container">
                    <div class="loading-spinner"></div>
                </div>
            </div>
        </div>

        <!-- Users Tab Content -->
        <div id="tab-content-users" class="products-table-wrap hidden">
            <h3>
                <i class="fa-solid fa-users"></i> Registered Users
                <button class="btn btn-icon" onclick="loadAdminUsers()" title="Refresh" style="margin-left:auto;">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </h3>
            <div id="admin-users-container">
                <div class="loading-spinner"></div>
            </div>
        </div>

        <!-- Orders Tab Content -->
        <div id="tab-content-orders" class="products-table-wrap hidden">
            <h3>
                <i class="fa-solid fa-receipt"></i> System Orders
                <button class="btn btn-icon" onclick="loadAdminOrders()" title="Refresh" style="margin-left:auto;">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </h3>
            <div id="admin-orders-container">
                <div class="loading-spinner"></div>
            </div>
        </div>
    </main>

    <!-- Product Detail Modal -->
    <div id="product-detail-modal" class="modal glass-panel">
        <div class="modal-content">
            <span class="btn-close" onclick="closeModal('product-detail-modal')"><i class="fa-solid fa-xmark"></i></span>
            <div id="product-detail-content">
                <div class="product-icon" style="height: 140px; font-size: 4rem; display: flex; align-items: center; justify-content: center; background: rgba(34, 197, 94, 0.08); border-radius: 12px; margin-bottom: 1.5rem; color: var(--primary);">
                    <i class="fa-solid fa-box-open" id="detail-product-icon"></i>
                </div>
                <h2 id="detail-product-name" style="margin-bottom: 0.5rem; font-size: 1.5rem;">Product Name</h2>
                <p id="detail-product-desc" class="subtitle" style="margin-bottom: 1.5rem; line-height: 1.6; font-size: 0.95rem;">Product description...</p>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <span id="detail-product-price" style="font-size: 1.6rem; font-weight: 700; color: var(--primary);">$0.00</span>
                    <span id="detail-product-stock" class="badge-stock">Stock: 0</span>
                </div>
            </div>
        </div>
    </div>

    <div id="user-edit-modal" class="modal glass-panel">
        <div class="modal-content">
            <span class="btn-close" onclick="closeModal('user-edit-modal')"><i class="fa-solid fa-xmark"></i></span>
            <h3 style="margin-bottom:1rem;"><i class="fa-solid fa-user-pen"></i> Edit User</h3>
            <form id="user-edit-form" class="modal-form" onsubmit="submitEditUser(event)">
                <input type="hidden" id="edit-user-id">
                <div>
                    <label for="edit-user-fullname">Full Name</label>
                    <input id="edit-user-fullname" type="text" required>
                </div>
                <div>
                    <label for="edit-user-email">Email</label>
                    <input id="edit-user-email" type="email" required>
                </div>
                <div>
                    <label for="edit-user-password">Password (leave blank to keep current)</label>
                    <input id="edit-user-password" type="password" placeholder="••••••••">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('user-edit-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-check"></i> Save changes</button>
                </div>
            </form>
        </div>
    </div>

    <div id="confirm-action-modal" class="modal glass-panel">
        <div class="modal-content">
            <span class="btn-close" onclick="closeModal('confirm-action-modal')"><i class="fa-solid fa-xmark"></i></span>
            <h3 style="margin-bottom:1rem;"><i class="fa-solid fa-exclamation-triangle"></i> Confirm action</h3>
            <p id="confirm-action-message" style="color: var(--text); line-height:1.6; margin-bottom:1.5rem;">Are you sure?</p>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" onclick="closeModal('confirm-action-modal')">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirm-action-button"><i class="fa-solid fa-check"></i> Confirm</button>
            </div>
        </div>
    </div>

    <div id="modal-overlay" class="overlay" onclick="closeAllModals()"></div>

    <script src="admin.js?v=4"></script>
</body>
</html>
